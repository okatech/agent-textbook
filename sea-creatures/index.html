<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おさかなを英語で発音練習</title>
<style>
  :root {
    --bg: #eef7fc;
    --card: #ffffff;
    --ink: #1d2b3a;
    --sub: #5b6b7c;
    --accent: #1f7fc4;
    --accent-soft: #d8ecf9;
    --stress: #e0484f;
    --border: #bcdcf0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a24; --card: #182634; --ink: #e8f0f7; --sub: #9fb1c3;
      --accent: #5cb3ee; --accent-soft: #1d3a52; --stress: #ff7b80; --border: #2a4257;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.6;
  }
  header { padding: 20px 16px 8px; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .credit { margin: 0 0 6px; font-size: .85rem; font-weight: 700; color: var(--accent); }
  .lead { color: var(--sub); margin: 0; font-size: .95rem; }

  .controls {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    max-width: 960px; margin: 0 auto; padding: 10px 16px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 8px 20px;
    border-bottom: 1px solid var(--border);
  }
  /* 3つの設定をすべて同じ形・同じ大きさにそろえる */
  .group { display: grid; grid-template-columns: 5em 1fr; align-items: center; gap: 8px; }
  .group > span { font-size: .9rem; font-weight: 700; color: var(--sub); }
  .seg { display: flex; border: 2px solid var(--accent); border-radius: 999px; overflow: hidden; }
  .seg button {
    flex: 1; min-height: 44px; border: 0; background: transparent; color: var(--accent); font: inherit;
    font-weight: 700; padding: 0 8px; cursor: pointer; white-space: nowrap;
  }
  .seg button + button { border-left: 2px solid var(--accent); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .grid > div { display: flex; flex-direction: column; }
  .card {
    flex: 1;
    background: var(--card); border: 2px solid var(--border); border-radius: 16px;
    padding: 10px; text-align: center; cursor: pointer; font: inherit; color: inherit;
    transition: transform .12s, border-color .12s;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { transform: scale(.97); }
  .card.playing { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .card img { width: 100%; max-width: 140px; aspect-ratio: 1; object-fit: contain;
              background: #fff; border-radius: 10px; }
  .card .word { font-size: 1.2rem; font-weight: 700; margin-top: 4px; }
  .card .ja { font-size: .8rem; color: var(--sub); }

  /* Detail panel */
  dialog {
    border: 0; border-radius: 20px; padding: 0; width: min(520px, calc(100% - 32px));
    background: var(--card); color: var(--ink);
  }
  dialog::backdrop { background: rgba(10, 30, 50, .55); }
  .detail { padding: 20px; }
  .detail-top { display: flex; gap: 16px; align-items: center; }
  .detail img { width: 120px; height: 120px; object-fit: contain; background: #fff; border-radius: 12px; flex-shrink: 0; }
  .detail h2 { margin: 0; font-size: 1.8rem; line-height: 1.2; }
  .detail .ja { color: var(--sub); }
  .ipa { font-family: "Charis SIL", "Doulos SIL", "Lucida Sans Unicode", "Segoe UI", serif;
         font-size: 1.15rem; margin-top: 4px; }
  .syl { margin: 16px 0 6px; font-size: 1.6rem; font-weight: 700; letter-spacing: .02em; }
  .syl .s { padding: 0 2px; }
  .syl .s.st { color: var(--stress); text-decoration: underline; text-underline-offset: 6px; }
  .syl .dot { color: var(--sub); font-weight: 400; }
  .legend { font-size: .8rem; color: var(--sub); }
  .tip { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin: 14px 0; font-size: .95rem; }
  .tip b { color: var(--accent); }
  .play-row { display: flex; gap: 10px; }
  .play-row button {
    flex: 1; min-height: 52px; border: 2px solid var(--accent); border-radius: 12px; padding: 14px 8px; font: inherit; font-weight: 700;
    font-size: 1rem; cursor: pointer; background: var(--accent); color: #fff;
  }
  .play-row button.slow { background: var(--card); color: var(--accent); border: 2px solid var(--accent); }
  .more {
    width: 100%; min-height: 44px; margin-top: 6px; border: 2px solid var(--accent); border-radius: 999px;
    background: var(--card); color: var(--accent); font: inherit; font-weight: 700; cursor: pointer;
  }
  .more:active { background: var(--accent-soft); }
  .close { margin-top: 12px; width: 100%; background: transparent; border: 0; color: var(--sub);
           font: inherit; padding: 8px; cursor: pointer; }

  .notice { max-width: 960px; margin: 0 auto; padding: 0 16px 24px; font-size: .85rem; color: var(--sub); }
  .warn { background: #fff4d6; color: #6b4e00; border-radius: 10px; padding: 10px 14px; margin: 0 16px 12px; display: none; }
</style>
</head>
<body>
<header>
  <h1>🐟 おさかなを英語で発音練習</h1>
  <p class="credit">アーヒスタ制作</p>
  <p class="lead">カードをタップすると英語の発音が流れます。発音のコツは「詳しく見る」で確認できます。</p>
</header>

<div class="controls">
  <div class="group">
    <span>速さ</span>
    <div class="seg" role="group" aria-label="再生速度">
      <button type="button" data-rate="slow" aria-pressed="false">🐢 ゆっくり</button>
      <button type="button" data-rate="normal" aria-pressed="true">🐟 ふつう</button>
    </div>
  </div>
  <div class="group">
    <span>アクセント</span>
    <div class="seg" role="group" aria-label="アクセント">
      <button type="button" data-accent="US" aria-pressed="true">🇺🇸 アメリカ</button>
      <button type="button" data-accent="UK" aria-pressed="false">🇬🇧 イギリス</button>
    </div>
  </div>
  <div class="group">
    <span>声</span>
    <div class="seg" role="group" aria-label="声">
      <button type="button" data-gender="female" aria-pressed="true">👩 女性</button>
      <button type="button" data-gender="male" aria-pressed="false">👨 男性</button>
    </div>
  </div>
</div>

<p class="warn" id="warn"></p>

<main>
  <div class="grid" id="grid"></div>
</main>

<p class="notice">
  ※ 音声はお使いの端末に入っている英語音声（読み上げエンジン）で再生されます。
  端末に入っている声の中から、なるべく自然に聞こえる女性・男性の声を自動で選びます。
</p>

<dialog id="dlg">
  <div class="detail" id="detail"></div>
</dialog>

<script>
// ---- 生き物データ -------------------------------------------------------
// ipaUS / ipaUK : 発音記号（辞書の表記に準拠）
// syl           : 音節の区切り。stress が強く読む音節の番号（0始まり）
// tip           : 日本人が間違えやすいポイント
const CREATURES = [
  { id: "shark", word: "shark", ja: "サメ",
    ipaUS: "/ʃɑːrk/", ipaUK: "/ʃɑːk/", syl: ["shark"], stress: [0],
    tip: "「シャーク」より口を大きく開けて <b>ʃɑː</b>。最後の k は息だけで、「ク」と母音を付けないのがコツ。" },
  { id: "dolphin", word: "dolphin", ja: "イルカ",
    ipaUS: "/ˈdɑːlfɪn/", ipaUK: "/ˈdɒlfɪn/", syl: ["dol", "phin"], stress: [0],
    tip: "<b>ph は f の音</b>。前を強く「<b>ダ</b>ルフィン」（米）。l は舌先を上の歯ぐきに付けたまま f へ。" },
  { id: "penguin", word: "penguin", ja: "ペンギン",
    ipaUS: "/ˈpeŋɡwɪn/", ipaUK: "/ˈpeŋɡwɪn/", syl: ["pen", "guin"], stress: [0],
    tip: "「ペンギン」ではなく「<b>ペ</b>ングウィン」。<b>gw</b> の音で唇を丸めるのがポイント。" },
  { id: "sea-turtle", word: "sea turtle", ja: "ウミガメ",
    ipaUS: "/ˈsiː ˌtɝːtl̩/", ipaUK: "/ˈsiː ˌtɜːtl̩/", syl: ["sea", "tur", "tle"], stress: [0],
    tip: "sea は「シー」ではなく <b>s の「スィー」</b>。turtle の tur は口をあまり開けずにこもった音、最後の tle は「トル」と軽く。" },
  { id: "ray", word: "ray", ja: "エイ",
    ipaUS: "/reɪ/", ipaUK: "/reɪ/", syl: ["ray"], stress: [0],
    tip: "<b>r は舌をどこにも付けず</b>、少し唇を丸めて「ゥレイ」。l（lay）と区別しましょう。" },
  { id: "jellyfish", word: "jellyfish", ja: "クラゲ",
    ipaUS: "/ˈdʒelifɪʃ/", ipaUK: "/ˈdʒelifɪʃ/", syl: ["jel", "ly", "fish"], stress: [0],
    tip: "前を強く「<b>ジェ</b>リフィッシュ」。fish の f は上の歯を下唇に当てて。" },
  { id: "hammerhead-shark", word: "hammerhead shark", ja: "シュモクザメ",
    ipaUS: "/ˈhæmərhed ʃɑːrk/", ipaUK: "/ˈhæməhed ʃɑːk/", syl: ["ham", "mer", "head", "shark"], stress: [0],
    tip: "ham の <b>æ</b> は「ア」と「エ」の中間。最初の ham を一番強く読みます。" },
  { id: "orca", word: "orca", ja: "シャチ",
    ipaUS: "/ˈɔːrkə/", ipaUK: "/ˈɔːkə/", syl: ["or", "ca"], stress: [0],
    tip: "「オルカ」ではなく「<b>オー</b>rカ」。r で「ル」と言わず、舌を奥に引くだけ。" },
  { id: "mackerel", word: "mackerel", ja: "サバ",
    ipaUS: "/ˈmækrəl/", ipaUK: "/ˈmækrəl/", syl: ["mack", "erel"], stress: [0],
    tip: "つづりは3音節に見えますが、実際は <b>2音節</b>で「<b>マ</b>クルル」に近い。真ん中の e はほぼ発音しません。" },
  { id: "clownfish", word: "clownfish", ja: "カクレクマノミ",
    ipaUS: "/ˈklaʊnfɪʃ/", ipaUK: "/ˈklaʊnfɪʃ/", syl: ["clown", "fish"], stress: [0],
    tip: "clown は「クローン」ではなく「<b>クラウン</b>」。cl の間に母音を入れないように。" },
  { id: "sardine", word: "sardine", ja: "イワシ",
    ipaUS: "/sɑːrˈdiːn/", ipaUK: "/sɑːˈdiːn/", syl: ["sar", "dine"], stress: [1],
    tip: "⚠️ <b>後ろを強く読む</b>のが最大のポイント！「サー<b>ディーン</b>」。日本語の「サーディン」とは強さの位置が違います。" },
  { id: "bonito", word: "bonito", ja: "カツオ",
    ipaUS: "/bəˈniːtoʊ/", ipaUK: "/bəˈniːtəʊ/", syl: ["bo", "ni", "to"], stress: [1],
    tip: "⚠️ <b>真ん中の ni を強く</b>「ボ<b>ニー</b>トウ」。最初の bo は弱く短く。米音では t が軽い「ラ」に近くなることも。" },
];

// ---- 状態 -------------------------------------------------------------
const RATES = { slow: 0.55, normal: 0.95 };
const state = { rate: "normal", accent: "US", gender: "female" };
try {
  const saved = JSON.parse(localStorage.getItem("seaPron") || "{}");
  Object.assign(state, saved);
} catch (e) {}
function save() {
  try { localStorage.setItem("seaPron", JSON.stringify(state)); } catch (e) {}
}

// ---- 音声（Web Speech API） -------------------------------------------
const synth = window.speechSynthesis;
let voices = [];

// 自然な発音になりやすい声を上位に並べるためのスコア
function voiceScore(v) {
  const n = v.name.toLowerCase();
  let s = 0;
  if (/natural|neural|premium|enhanced/.test(n)) s += 50;
  if (/google/.test(n)) s += 30;
  if (/samantha|ava|allison|aria|jenny|guy|daniel|serena|libby|sonia|ryan|aaron|nicky|evan|nathan|zoe|arthur/.test(n)) s += 20;
  if (!v.localService) s += 5;
  if (/eddy|flo\b|reed|rocko|sandy|shelley|grandma|grandpa/.test(n)) s -= 30; // 機械っぽいが発音は正確
  if (/compact|novelty|whisper|bells|bad news|jester|zarvox|trinoids|bubbles|boing|cellos|organ|albert|superstar|wobble|good news|hysterical/.test(n)) s -= 100;
  return s;
}
function accentLang() { return state.accent === "US" ? "en-US" : "en-GB"; }

// 声の名前から性別を判定（ブラウザは性別情報をくれないため、主要な声の名前で見分ける）
const FEMALE = /female|flo\b|sandy|shelley|grandma|samantha|ava\b|allison|susan|victoria|zoe|nicky|kate|serena|stephanie|martha|moira|tessa|karen|fiona|aria|jenny|zira|libby|sonia|hazel|michelle|emma|ana\b|ashley|cora|elizabeth|jane|monica|nancy|sara|amber|maisie|mia\b|google us english/;
const MALE = /\bmale\b|eddy|reed|rocko|grandpa|alex\b|daniel|fred\b|tom\b|aaron|arthur|evan|nathan|oliver|rishi|david|guy\b|mark\b|ryan|george|christopher|eric\b|roger|steffan|brian|andrew|thomas|alfie|elliot|ethan|jacob|tony|davis|jason/;
function genderOf(v) {
  const n = v.name.toLowerCase();
  if (FEMALE.test(n)) return "female";
  if (MALE.test(n)) return "male";
  return null;
}

// 英語の声をすべて集め、自然な順に並べる（変な効果音系の声は除外）
function loadVoices() {
  const all = synth ? synth.getVoices() : [];
  voices = all.filter(v => /^en/i.test(v.lang) && voiceScore(v) > -50)
              .sort((a, b) => voiceScore(b) - voiceScore(a));
}
const langOf = v => v.lang.replace("_", "-").toLowerCase();
// 英国の女性の声がない端末向けに、発音が近い地域の声を次の候補にする
const NEAR = { US: ["en-ca"], UK: ["en-ie", "en-au", "en-nz", "en-za"] };

// 選んだアクセント・性別に一番合う声を返す。
// ①同じアクセント＆性別 → ②近いアクセント＆性別 → ③英語の同じ性別 → ④声の高さで調整
function pickVoice() {
  const lang = accentLang().toLowerCase();
  const sameGender = voices.filter(v => genderOf(v) === state.gender);
  const match = sameGender.find(v => langOf(v) === lang)
             || sameGender.find(v => NEAR[state.accent].includes(langOf(v)))
             || sameGender[0];
  if (match) return { voice: match, pitch: 1 };
  const base = voices.find(v => langOf(v) === lang) || voices[0];
  return { voice: base, pitch: state.gender === "male" ? 0.8 : 1.15 };
}

function speak(creature, rateKey, cardEl) {
  if (!synth) return;
  synth.cancel(); // 前の音声を止めてから再生
  const u = new SpeechSynthesisUtterance(creature.word);
  u.lang = accentLang();
  const { voice, pitch } = pickVoice();
  if (voice) u.voice = voice;
  u.rate = RATES[rateKey || state.rate];
  u.pitch = pitch;
  if (cardEl) {
    document.querySelectorAll(".card.playing").forEach(c => c.classList.remove("playing"));
    cardEl.classList.add("playing");
    u.onend = u.onerror = () => cardEl.classList.remove("playing");
  }
  synth.speak(u);
}

// ---- 画面 -------------------------------------------------------------
function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  CREATURES.forEach(c => {
    const wrap = document.createElement("div");
    const btn = document.createElement("button");
    btn.className = "card";
    btn.type = "button";
    btn.setAttribute("aria-label", c.word + " を再生");
    btn.innerHTML = `<img src="img/${c.id}.png" alt="${c.ja}">
      <div class="word">${c.word}</div><div class="ja">${c.ja}</div>`;
    btn.addEventListener("click", () => speak(c, null, btn));
    const more = document.createElement("button");
    more.type = "button";
    more.className = "more";
    more.textContent = "詳しく見る";
    more.addEventListener("click", () => openDetail(c));
    wrap.append(btn, more);
    grid.appendChild(wrap);
  });
}

function sylHTML(c) {
  return c.syl.map((s, i) =>
    `<span class="s${c.stress.includes(i) ? " st" : ""}">${s}</span>`
  ).join('<span class="dot">・</span>');
}

function openDetail(c) {
  const ipa = state.accent === "US" ? c.ipaUS : c.ipaUK;
  document.getElementById("detail").innerHTML = `
    <div class="detail-top">
      <img src="img/${c.id}.png" alt="${c.ja}">
      <div>
        <h2>${c.word}</h2>
        <div class="ja">${c.ja}</div>
        <div class="ipa">${state.accent === "US" ? "🇺🇸" : "🇬🇧"} ${ipa}</div>
      </div>
    </div>
    <div class="syl">${sylHTML(c)}</div>
    <div class="legend"><span style="color:var(--stress);font-weight:700">赤い下線</span> = 強く読むところ（アクセント）</div>
    <div class="tip">💡 ${c.tip}</div>
    <div class="play-row">
      <button type="button" class="slow" data-r="slow">🐢 ゆっくり</button>
      <button type="button" data-r="normal">🐟 ふつう</button>
    </div>
    <button type="button" class="close">閉じる</button>`;
  const dlg = document.getElementById("dlg");
  dlg.querySelectorAll("[data-r]").forEach(b =>
    b.addEventListener("click", () => speak(c, b.dataset.r)));
  dlg.querySelector(".close").addEventListener("click", () => dlg.close());
  dlg.showModal();
  speak(c, "slow"); // 開いたときはまずゆっくり
}
document.getElementById("dlg").addEventListener("click", e => {
  if (e.target.id === "dlg") e.target.close(); // 背景タップで閉じる
});

function syncButtons() {
  document.querySelectorAll("[data-rate]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.rate === state.rate)));
  document.querySelectorAll("[data-accent]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.accent === state.accent)));
  document.querySelectorAll("[data-gender]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.gender === state.gender)));
}
document.querySelectorAll("[data-rate]").forEach(b => b.addEventListener("click", () => {
  state.rate = b.dataset.rate; save(); syncButtons();
}));
document.querySelectorAll("[data-accent]").forEach(b => b.addEventListener("click", () => {
  state.accent = b.dataset.accent; loadVoices(); save(); syncButtons();
}));
document.querySelectorAll("[data-gender]").forEach(b => b.addEventListener("click", () => {
  state.gender = b.dataset.gender; save(); syncButtons();
  speak(CREATURES[0]); // 選んだ声を試聴
}));

renderGrid();
syncButtons();
if (!synth) {
  const w = document.getElementById("warn");
  w.textContent = "このブラウザは音声読み上げに対応していません。Chrome / Safari / Edge の最新版でお試しください。";
  w.style.display = "block";
} else {
  loadVoices();
  // 音声リストは後から読み込まれるブラウザがあるため、届いたら作り直す
  synth.onvoiceschanged = loadVoices;
}
</script>
</body>
</html>
