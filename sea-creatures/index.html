<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おさかなを英語で発音練習</title>
<meta name="theme-color" content="#1f7fc4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おさかな発音">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #eef7fc;
    --card: #ffffff;
    --ink: #1d2b3a;
    --sub: #5b6b7c;
    --accent: #1f7fc4;
    --on-accent: #ffffff;   /* 青いボタンの上の文字色 */
    --accent-soft: #d8ecf9;
    --stress: #e0484f;
    --border: #bcdcf0;
    --note-bg: #fff4d6; --note-ink: #4a3800; --note-strong: #b25e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a24; --card: #182634; --ink: #e8f0f7; --sub: #9fb1c3;
      --accent: #5cb3ee; --on-accent: #0f1a24; --accent-soft: #1d3a52; --stress: #ff7b80; --border: #2a4257;
      --note-bg: #3a2f12; --note-ink: #f3e6c4; --note-strong: #ffb84d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  /* スマホ向け：ボタンの連打で画面が拡大しない／タップ時の灰色の影を出さない */
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; font: inherit; cursor: pointer; }
  /* 長押しで画像保存メニューや文字選択が出ないようにする */
  .card, .card img, .detail img { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body.modal-open { overflow: hidden; }
  header { padding: 20px 16px 8px; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .credit { margin: 0 0 6px; font-size: .85rem; font-weight: 700; color: var(--accent); }
  .lead { color: var(--sub); margin: 0; font-size: .95rem; }

  /* ボタンの共通スタイル（すべて丸いピル型・高さ44px以上） */
  .btn {
    display: block; width: 100%; min-height: 44px; border-radius: 999px; font-weight: 700;
    border: 2px solid var(--accent); background: var(--card); color: var(--accent);
  }
  .btn:active { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); color: var(--on-accent); min-height: 52px; font-size: 1.05rem; }

  .controls {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .seg { display: flex; max-width: 360px; margin: 0 auto; border: 2px solid var(--accent); border-radius: 999px; overflow: hidden; }
  .seg button { flex: 1; min-height: 44px; border: 0; background: transparent; color: var(--accent); font-weight: 700; }
  .seg button + button { border-left: 2px solid var(--accent); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  .note {
    max-width: 928px; margin: 12px auto 0; padding: 10px 14px; border-radius: 10px;
    background: var(--note-bg); color: var(--note-ink); font-size: .9rem;
  }
  .note[hidden] { display: none; }

  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .grid > div { display: flex; flex-direction: column; gap: 6px; }
  .card {
    flex: 1; background: var(--card); border: 2px solid var(--border); border-radius: 16px;
    padding: 10px; text-align: center; color: inherit; transition: transform .12s, border-color .12s;
  }
  .card:active { transform: scale(.97); }
  .card.playing { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .card img { width: 100%; max-width: 140px; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 10px; }
  .card .word { font-size: 1.15rem; font-weight: 700; margin-top: 4px; line-height: 1.3; }
  .card .ja { font-size: .8rem; color: var(--sub); }

  /* 詳細画面 */
  dialog {
    border: 0; border-radius: 20px; padding: 0; width: min(520px, calc(100% - 32px));
    background: var(--card); color: var(--ink);
    max-height: 90vh; max-height: 90dvh; overflow-y: auto; overscroll-behavior: contain;
  }
  dialog::backdrop { background: rgba(10, 30, 50, .55); }
  .detail { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .detail-top { display: flex; gap: 16px; align-items: center; }
  .detail-top > div { min-width: 0; }
  .detail img { width: 110px; height: 110px; object-fit: contain; background: #fff; border-radius: 12px; flex-shrink: 0; }
  .detail h2 { margin: 0; font-size: clamp(1.2rem, 6vw, 1.7rem); line-height: 1.2; overflow-wrap: break-word; }
  .detail .ja { color: var(--sub); }
  .ipa { font-family: "Charis SIL", "Doulos SIL", "Lucida Sans Unicode", "Segoe UI", serif; font-size: 1.15rem; margin-top: 4px; }
  .syl { font-size: 1.6rem; font-weight: 700; }
  .syl .s.st { color: var(--stress); text-decoration: underline; text-underline-offset: 6px; }
  .syl .dot { color: var(--sub); font-weight: 400; padding: 0 4px; }
  .legend { font-size: .8rem; color: var(--sub); margin-top: -8px; }
  .box { border-radius: 12px; padding: 12px 14px; font-size: .95rem; }
  .tip { background: var(--accent-soft); }
  .tip b { color: var(--accent); }
  .fun { background: var(--note-bg); color: var(--note-ink); }
  .fun b { color: var(--note-strong); }
  @media (max-width: 520px) {
    .detail { padding: 16px; }
    .detail img { width: 90px; height: 90px; }
  }

  .notice { max-width: 960px; margin: 0 auto; padding: 0 16px 24px; font-size: .85rem; color: var(--sub); }
  .notice h2 { font-size: 1rem; color: var(--ink); margin: 16px 0 6px; }
</style>
</head>
<body>
<header>
  <h1>🐟 おさかなを英語で発音練習</h1>
  <p class="credit">アーヒスタ制作</p>
  <p class="lead">カードをタップすると英語の発音が流れます。発音のコツは「詳しく見る」で確認できます。</p>
</header>

<div class="controls">
  <div class="seg" role="group" aria-label="声">
    <button type="button" data-gender="female" aria-pressed="true">👩 女性の声</button>
    <button type="button" data-gender="male" aria-pressed="false">👨 男性の声</button>
  </div>
</div>

<p class="note" id="note" hidden></p>

<main>
  <div class="grid" id="grid"></div>
</main>

<section class="notice">
  <p>※ 発音はアメリカ英語です。音声はお使いのスマホに入っている読み上げ機能で再生されます。</p>
  <h2>🎧 より自然な声で聞くには</h2>
  <p><b>iPhone：</b>「設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 英語」から、
  <b>「拡張」「プレミアム」</b>の声をダウンロードすると、さらに自然な発音になります。</p>
  <p><b>Android：</b>男性・女性の声を選べない機種では、声の高さを変えて切り替えます（発音は同じです）。</p>
</section>

<dialog id="dlg">
  <div class="detail" id="detail"></div>
</dialog>

<script>
// ---- 生き物データ -------------------------------------------------------
// ipa           : アメリカ英語の発音記号（辞書の表記に準拠）
// syl           : 音節の区切り。stress が強く読む音節の番号（0始まり）
// tip           : 日本人が間違えやすいポイント
// fun           : その生き物のおもしろ豆知識
const CREATURES = [
  { id: "shark", word: "shark", ja: "サメ",
    ipa: "/ʃɑːrk/",
    syl: ["shark"], stress: [0],
    tip: "「シャーク」より口を大きく開けて <b>ʃɑː</b>、そのまま舌を奥に引いて <b>r</b> の響きを付けます。最後の k は息だけで、「ク」と母音を付けないのがコツ。",
    fun: "サメには<b>骨がありません</b>。体を支えているのは、骨よりも軽くてしなやかな「軟骨」。歯は一生生え変わり続け、一生で数万本も使う種類もいます。" },
  { id: "dolphin", word: "dolphin", ja: "イルカ",
    ipa: "/ˈdɑːlfɪn/",
    syl: ["dol", "phin"], stress: [0],
    tip: "<b>ph は f の音</b>。前を強く「<b>ダ</b>ルフィン」（米）。l は舌先を上の歯ぐきに付けたまま f へ。",
    fun: "イルカは<b>脳を半分ずつ眠らせる</b>ことができます。片方の目を開けたまま眠り、泳ぎながら息つぎを続けられます。" },
  { id: "penguin", word: "penguin", ja: "ペンギン",
    ipa: "/ˈpeŋɡwɪn/",
    syl: ["pen", "guin"], stress: [0],
    tip: "「ペンギン」ではなく「<b>ペ</b>ングウィン」。<b>gw</b> の音で唇を丸めるのがポイント。",
    fun: "コウテイペンギンは<b>水深500m以上</b>まで潜れます。空は飛べませんが、海の中ではまさに「飛ぶように」泳ぎます。" },
  { id: "sea-turtle", word: "sea turtle", ja: "ウミガメ",
    ipa: "/ˈsiː ˌtɝːtl̩/",
    syl: ["sea", "tur", "tle"], stress: [0],
    tip: "sea は「シー」ではなく <b>s の「スィー」</b>。turtle の tur は口をあまり開けずにこもった音、アメリカ英語では t がやわらかくなり、「<b>ター</b>ドゥル」に近く聞こえます。",
    fun: "ウミガメは自分が生まれた砂浜を<b>地球の磁場</b>で覚えていて、大人になると何千kmも旅して同じ浜に戻り、卵を産みます。" },
  { id: "ray", word: "ray", ja: "エイ",
    ipa: "/reɪ/",
    syl: ["ray"], stress: [0],
    tip: "<b>r は舌をどこにも付けず</b>、少し唇を丸めて「ゥレイ」。l（lay）と区別しましょう。",
    fun: "エイは<b>サメの親戚</b>。お腹側にある「笑った顔」のように見える部分は、実は鼻の穴と口。本当の目は背中側にあります。" },
  { id: "jellyfish", word: "jellyfish", ja: "クラゲ",
    ipa: "/ˈdʒelifɪʃ/",
    syl: ["jel", "ly", "fish"], stress: [0],
    tip: "前を強く「<b>ジェ</b>リフィッシュ」。fish の f は上の歯を下唇に当てて。",
    fun: "クラゲには<b>脳も心臓も骨もありません</b>。体の約95%は水。ベニクラゲは若い姿に戻れるため「不老不死のクラゲ」と呼ばれます。" },
  { id: "hammerhead-shark", word: "hammerhead shark", ja: "シュモクザメ",
    ipa: "/ˈhæmɚhed ˌʃɑːrk/",
    syl: ["ham", "mer", "head", "shark"], stress: [0],
    tip: "ham の <b>æ</b> は「ア」と「エ」の中間。最初の ham を一番強く読みます。",
    fun: "ハンマー型の頭は<b>金属探知機</b>のよう。砂の中に隠れたエイが出すかすかな電気を感じ取って見つけます。" },
  { id: "orca", word: "orca", ja: "シャチ",
    ipa: "/ˈɔːrkə/",
    syl: ["or", "ca"], stress: [0],
    tip: "「オルカ」ではなく「<b>オー</b>rカ」。r で「ル」と言わず、舌を奥に引くだけ。",
    fun: "英語では <b>killer whale</b>（殺し屋のクジラ）とも呼ばれますが、実は<b>イルカの仲間で最大</b>。群れごとに鳴き声の「方言」があります。" },
  { id: "mackerel", word: "mackerel", ja: "サバ",
    ipa: "/ˈmækrəl/",
    syl: ["mack", "erel"], stress: [0],
    tip: "つづりは3音節ですが、アメリカ英語では <b>2音節</b>で「<b>マ</b>クラル」と読まれることが多く、真ん中の e はとても弱くなります。",
    fun: "英語の <b>“Holy mackerel!”</b> は「なんてこった！」「うそでしょ！」という驚きの表現。サバが出てくるのに魚とは関係ありません。" },
  { id: "clownfish", word: "clownfish", ja: "カクレクマノミ",
    ipa: "/ˈklaʊnfɪʃ/",
    syl: ["clown", "fish"], stress: [0],
    tip: "clown は「クローン」ではなく「<b>クラウン</b>」。cl の間に母音を入れないように。",
    fun: "カクレクマノミは<b>みんなオスとして生まれ</b>、群れで一番大きな1匹がメスに変わります。イソギンチャクの毒は体のぬめりで防いでいます。" },
  { id: "sardine", word: "sardine", ja: "イワシ",
    ipa: "/sɑːrˈdiːn/",
    syl: ["sar", "dine"], stress: [1],
    tip: "<b>後ろを強く読む</b>のが最大のポイント！「サー<b>ディーン</b>」。日本語の「サーディン」とは強さの位置が違います。",
    fun: "英語の <b>“packed like sardines”</b> は「すし詰め」の意味。缶詰のイワシのようにぎゅうぎゅう、という例えです。" },
  { id: "bonito", word: "bonito", ja: "カツオ",
    ipa: "/bəˈniːtoʊ/",
    syl: ["bo", "ni", "to"], stress: [1],
    tip: "<b>真ん中の ni を強く</b>「ボ<b>ニー</b>トウ」。最初の bo は弱く短く。米音では t が軽い「ラ」に近くなることも。",
    fun: "実は、日本の「カツオ」は英語で正確には <b>skipjack tuna</b>（マグロの仲間）。でも鰹節は英語で <b>bonito flakes</b> と呼ばれます。" },
];

// ---- 設定（声の男女だけ。端末に保存して次回も使う） ----------------------
const state = { gender: "female" };
try {
  const saved = JSON.parse(localStorage.getItem("seaPron") || "{}");
  if (saved && ["female", "male"].includes(saved.gender)) state.gender = saved.gender;
} catch (e) {}
function save() {
  try { localStorage.setItem("seaPron", JSON.stringify(state)); } catch (e) {}
}

// ---- 音声（Web Speech API） -------------------------------------------
const synth = window.speechSynthesis;
const langOf = v => v.lang.replace("_", "-").toLowerCase();
let voices = []; // アメリカ英語の声（自然な順）

// 自然に聞こえやすい声ほど高いスコア。効果音のような声は除外する
function voiceScore(v) {
  const n = v.name.toLowerCase();
  let s = 0;
  if (/natural|neural|premium|enhanced/.test(n)) s += 50;
  if (/google/.test(n)) s += 30;
  if (/samantha|ava|allison|aria|jenny|michelle|emma|zoe|nicky|guy|andrew|brian|aaron|evan|nathan/.test(n)) s += 20;
  if (!v.localService) s += 5;
  if (/eddy|flo\b|reed|rocko|sandy|shelley|grandma|grandpa/.test(n)) s -= 30; // 機械っぽいが発音は正確
  if (/compact|novelty|whisper|bells|bad news|good news|jester|zarvox|trinoids|bubbles|boing|cellos|organ|albert|superstar|wobble|hysterical|bahh|deranged|princess/.test(n)) s -= 100;
  return s;
}

// 声の名前から男女を判定（ブラウザは性別を教えてくれないため、主なアメリカ英語の声の名前で見分ける）
const FEMALE = /female|samantha|ava|allison|susan|victoria|zoe|nicky|kathy|aria|jenny|zira|michelle|emma|ana\b|ashley|cora|elizabeth|jane|monica|nancy|sara|amber|flo\b|sandy|shelley|grandma|google us english/;
const MALE = /\bmale\b|aaron|fred\b|junior|ralph|tom\b|evan|nathan|alex\b|david|mark\b|guy\b|andrew|brian|christopher|eric\b|roger|steffan|davis|jason|tony|jacob|eddy|reed|rocko|grandpa/;
function genderOf(v) {
  const n = v.name.toLowerCase();
  if (FEMALE.test(n)) return "female";
  if (MALE.test(n)) return "male";
  return null;
}

function loadVoices() {
  voices = (synth ? synth.getVoices() : [])
    .filter(v => langOf(v) === "en-us" && voiceScore(v) > -50)
    .sort((a, b) => voiceScore(b) - voiceScore(a));
  showNote();
}

// 選んだ性別のアメリカ英語の声のうち、一番自然な声を返す。
// 男性の声がない端末では、声の高さ（pitch）を下げて男性らしくする。
function pickVoice() {
  const match = voices.find(v => genderOf(v) === state.gender);
  if (match) return { voice: match, pitch: 1 };
  return { voice: voices[0], pitch: state.gender === "male" ? 0.8 : 1 };
}

// LINE・Instagram などのアプリ内ブラウザは読み上げが不安定
const IN_APP = /Line\/|FBAN|FBAV|Instagram|Twitter|MicroMessenger|KAKAOTALK/i.test(navigator.userAgent);

// 注意が必要なときだけ、画面に ⚠️ で知らせる
function showNote() {
  const el = document.getElementById("note");
  let msg = "";
  if (!synth) msg = "このブラウザは音声読み上げに対応していません。Safari / Chrome の最新版でお試しください。";
  else if (IN_APP) msg = "アプリ内のブラウザでは音声が正しく再生されないことがあります。メニューから「Safari で開く」/「Chrome で開く」を選んでください。";
  else {
    const { voice, pitch } = pickVoice();
    if (!voice) msg = "この端末にはアメリカ英語の声が見つからないため、端末の標準の声で再生します。";
    else if (pitch !== 1) msg = "この端末では男性の声を選べないため、声の高さを下げて再生します（発音は同じです）。";
    else if (state.gender === "female" && genderOf(voice) === "male") msg = "この端末には女性の声がないため、男性の声で再生します。";
  }
  el.textContent = msg ? "⚠️ " + msg : "";
  el.hidden = !msg;
}

let current = null; // 再生中の音声（参照を持っておかないと Chrome で終了通知が届かないことがある）

function clearPlaying() {
  document.querySelectorAll(".card.playing").forEach(c => c.classList.remove("playing"));
}

function speak(creature, cardEl) {
  if (!synth) return;
  if (!voices.length) loadVoices(); // 声の一覧がまだ届いていない端末向け
  const { voice, pitch } = pickVoice();
  const u = new SpeechSynthesisUtterance(creature.word);
  u.lang = voice ? voice.lang.replace("_", "-") : "en-US";
  if (voice) u.voice = voice;
  u.pitch = pitch;
  clearPlaying();
  if (cardEl) cardEl.classList.add("playing");
  const finish = () => {
    if (current !== u) return; // 止めた古い音声の通知で、新しいカードの表示を消さない
    current = null;
    clearTimeout(safety);
    if (cardEl) cardEl.classList.remove("playing");
  };
  u.onend = u.onerror = finish;
  // Android では終了の通知が来ないことがあるため、一定時間で「再生中」表示を必ず消す
  const safety = setTimeout(finish, 6000);
  const busy = synth.speaking || synth.pending;
  current = u;
  synth.cancel(); // 前の音声を止めてから再生
  synth.resume(); // Chrome で読み上げが一時停止のまま固まるのを防ぐ
  // 止めた直後に再生すると無視される端末があるため、再生中だったときだけ少し待つ
  if (busy) setTimeout(() => { if (current === u) synth.speak(u); }, 80);
  else synth.speak(u);
}

// ---- 画面 -------------------------------------------------------------
function renderGrid() {
  const grid = document.getElementById("grid");
  CREATURES.forEach(c => {
    const wrap = document.createElement("div");
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.setAttribute("aria-label", c.word + " を再生");
    card.innerHTML = `<img src="img/${c.id}.png" alt="${c.ja}">
      <div class="word">${c.word}</div><div class="ja">${c.ja}</div>`;
    card.addEventListener("click", () => speak(c, card));
    const more = document.createElement("button");
    more.type = "button";
    more.className = "btn";
    more.textContent = "詳しく見る";
    more.addEventListener("click", () => openDetail(c));
    wrap.append(card, more);
    grid.appendChild(wrap);
  });
}

function sylHTML(c) {
  return c.syl.map((s, i) => `<span class="s${c.stress.includes(i) ? " st" : ""}">${s}</span>`)
    .join('<span class="dot">・</span>');
}

const dlg = document.getElementById("dlg");
function openDetail(c) {
  document.getElementById("detail").innerHTML = `
    <div class="detail-top">
      <img src="img/${c.id}.png" alt="${c.ja}">
      <div>
        <h2>${c.word}</h2>
        <div class="ja">${c.ja}</div>
        <div class="ipa">${c.ipa}</div>
      </div>
    </div>
    <div class="syl">${sylHTML(c)}</div>
    <div class="legend"><span style="color:var(--stress);font-weight:700">赤い下線</span> = 強く読むところ</div>
    <button type="button" class="btn primary" data-play>🔊 聞く</button>
    <div class="box tip">💡 <b>発音のコツ</b><br>${c.tip}</div>
    <div class="box fun">🐠 <b>おもしろ豆知識</b><br>${c.fun}</div>
    <button type="button" class="btn" data-close>閉じる</button>`;
  dlg.querySelector("[data-play]").addEventListener("click", () => speak(c));
  dlg.querySelector("[data-close]").addEventListener("click", () => dlg.close());
  dlg.showModal();
  document.body.classList.add("modal-open");
  dlg.scrollTop = 0; // ボタンに自動で移るフォーカスで下にずれないよう、必ず一番上から表示
}
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); }); // 背景タップで閉じる
dlg.addEventListener("close", () => document.body.classList.remove("modal-open"));

// 声の切り替え（設定を変えるだけで、音は鳴らさない）
function syncButtons() {
  document.querySelectorAll("[data-gender]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.gender === state.gender)));
}
document.querySelectorAll("[data-gender]").forEach(b => b.addEventListener("click", () => {
  state.gender = b.dataset.gender; save(); syncButtons(); showNote();
}));

renderGrid();
syncButtons();
showNote();
if (synth) {
  loadVoices();
  // 声の一覧は後から届くブラウザがあるため、届いたら作り直す
  synth.onvoiceschanged = loadVoices;
  // iPhone では通知が来ないことがあるので、最初の数秒は自分で取りに行く
  let tries = 0;
  const poll = setInterval(() => {
    if (synth.getVoices().length) loadVoices();
    if (++tries >= 10) clearInterval(poll);
  }, 300);
  // 別のアプリに切り替えたら読み上げを止め、「再生中」表示も消す
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { current = null; synth.cancel(); clearPlaying(); }
  });
}
</script>
</body>
</html>
