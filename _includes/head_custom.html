<!-- Mermaid for diagrams + custom styling -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose', flowchart: { htmlLabels: true, curve: 'basis' } });
  window.addEventListener('load', () => {
    document.querySelectorAll('pre > code.language-mermaid').forEach((el, i) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'm' + i;
      div.textContent = el.textContent;
      el.parentElement.replaceWith(div);
    });
    mermaid.run();
  });
</script>
<style>
  .mermaid { background: #fafbfc; padding: 16px; border-radius: 8px; margin: 16px 0; text-align: center; }
  .callout { background: #fff8e1; border-left: 4px solid #f9a825; padding: 12px 16px; margin: 16px 0; border-radius: 4px; }
  .callout-blue { background: #e3f2fd; border-left-color: #1976d2; }
  .callout-green { background: #e8f5e9; border-left-color: #43a047; }
  .callout-purple { background: #f3e5f5; border-left-color: #8e24aa; }
  table { display: table; width: 100%; }
  th { background: #f6f8fa; }
  blockquote { border-left: 4px solid #1976d2; background: #f6f8fa; padding: 8px 16px; }
</style>
